name: Wedding Waitress live radius verification
on:
  push:
    branches: [codex/radius-live-verification-20261124]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 10
          filter: blob:none
          sparse-checkout: |
            /scripts/radius-live-verification/
            /public/sitemap.xml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve published application source
        run: git diff --exit-code 33ec399845c312b5689811e68a20542806e12479 HEAD -- src public
      - name: Install isolated browser verification runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/radius-playwright" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/radius-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Retrieve completed responsive verification evidence
        uses: actions/download-artifact@v4
        with:
          name: radius-live-verification
          run-id: 45269000134
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/radius-output
      - name: Export production PDF - budget
        if: ${{ !cancelled() }}
        env:
          WW_QA_ROOT: ${{ runner.temp }}/radius-output
          WW_QA_PLAYWRIGHT_MODULE: ${{ runner.temp }}/radius-playwright/node_modules/playwright
          WW_QA_EXPORT_CASE: budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/radius-live-verification/hosted-pdfs.mjs https://weddingwaitress.com.au live-ci 2>&1 | tee "$WW_QA_ROOT/pdf-budget-final.log"
      - name: Export production PDF - qr
        if: ${{ !cancelled() }}
