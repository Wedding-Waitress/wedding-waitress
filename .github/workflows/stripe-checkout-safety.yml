name: Wedding Waitress Stripe Checkout Safety

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/prelaunch.ts'
      - 'src/lib/packagePricing.ts'
      - 'src/lib/stripePrices.ts'
      - 'src/lib/currencyPricing.ts'
      - 'src/lib/planRegistry.ts'
      - 'src/pages/UpgradeCheckout.tsx'
      - 'src/lib/packagePricing.test.ts'
      - 'supabase/functions/create-checkout/**'
      - 'supabase/functions/verify-payment/**'
      - 'supabase/functions/_shared/**'
      - '.github/workflows/stripe-checkout-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin npm version
        run: npm install --global npm@11.19.1
      - name: Install locked dependencies
        run: npm ci
      - name: Run checkout contract tests
        run: npx vitest run src/lib/packagePricing.test.ts src/pages/UpgradeCheckout.consent.test.tsx src/lib/paidPlanFulfillmentEvidence.test.ts src/lib/paidPlanVerificationHandler.test.ts src/lib/renewalCheckoutHandler.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build production app
        run: npm run build
