name: Repair Wedding Waitress npm lockfile
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/repair-npm-lockfile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout draft branch
        uses: actions/checkout@v4
        with:
          ref: fix/stripe-live-catalogue-expo-2026
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm with corrected peer dependency resolution
        run: npm install --global npm@11.19.1
      - name: Regenerate lockfile cleanly without running dependency scripts
        run: |
          rm package-lock.json
          npm install --save-dev --package-lock-only --ignore-scripts --no-audit --no-fund @testing-library/dom@10.4.2
      - name: Verify the lockfile with a clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit repaired lockfile to draft branch
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo 'package-lock.json already in sync'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json
          git commit -m 'Reconcile npm lockfile with current package versions'
          git push origin HEAD:fix/stripe-live-catalogue-expo-2026
